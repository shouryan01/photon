name: Build and Release Photon

on:
  push:
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Info.plist'
      - 'Resources/**'
      - 'Scripts/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build macOS Native App
    runs-on: macos-15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Standalone App Bundle
        run: |
          chmod +x build.sh Scripts/build_app.sh
          ./build.sh

      - name: Ad-hoc Code Sign App Bundle
        run: |
          codesign --force --deep --sign - build/Photon.app

      - name: Create Release Archive
        run: |
          ditto -c -k --keepParent build/Photon.app Photon-macOS.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photon-macOS
          path: Photon-macOS.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Generate timestamp
        id: timestamp
        run: echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Photon-macOS
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ env.TIMESTAMP }}
          name: "Release ${{ env.TIMESTAMP }}"
          body: "Automated release of Photon for macOS (Apple Silicon arm64)."
          prerelease: false
          files: artifacts/Photon-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
